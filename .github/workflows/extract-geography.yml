
name: Extract INEC Geography CSV

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check compressed file
        run: |
          test -f Nigeria_polling_units.csv.gz
          gzip -t Nigeria_polling_units.csv.gz

      - name: Extract CSV
        run: |
          gzip -dc Nigeria_polling_units.csv.gz > Nigeria_polling_units.csv
          echo "Extraction completed."
          ls -lh Nigeria_polling_units.csv
          wc -l Nigeria_polling_units.csv

      - name: Commit extracted CSV to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Nigeria_polling_units.csv

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add extracted INEC polling unit geography CSV"
            git push origin HEAD:main
          fi
